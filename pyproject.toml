[project]
name = "gdpval-eval"
version = "0.1.0"
description = "AI office-product cross-evaluation harness on the GDPval dataset"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=17",
    "cryptography>=43",
    "httpx[socks]>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=5",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdpval_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs network and real GDPval data; run explicitly with -m integration",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
