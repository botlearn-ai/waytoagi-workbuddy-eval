[project]
name = "gdpval-eval"
version = "0.2.0"
description = "GDPval 判分:豆包工作 / 千问办公 / WorkBuddy 横向测评"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=17",
    "httpx[socks]>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=5",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
